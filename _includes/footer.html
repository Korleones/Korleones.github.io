<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <style>
    .site-footer {
      border-top: 1px solid #eceff5;
      padding: 1rem 0 1.2rem;
    }

    .footer-mini {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      align-items: center;
      color: #68728e;
      font-size: 0.86rem;
    }

    .footer-mini-links {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .footer-mini-links a {
      color: #526084;
      text-decoration: none;
    }

    .footer-mini-links a:hover {
      color: #314b95;
    }

    @media (max-width: 640px) {
      .footer-mini {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <div class="wrapper footer-mini">
    <div>© {{ "now" | date: "%Y" }} {{ site.title | escape }} · Built with Jekyll</div>
    <ul class="footer-mini-links">
      <li><a href="{{ '/works/' | relative_url }}">Works</a></li>
      <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
      <li><a href="{{ '/about/' | relative_url }}">About</a></li>
      {%- if site.email -%}
        <li><a class="u-email" href="mailto:{{ site.email }}">Email</a></li>
      {%- endif -%}
    </ul>
  </div>
</footer>
