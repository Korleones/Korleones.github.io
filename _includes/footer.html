<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <style>
    .site-footer {
      border-top: 1px solid #eceff5;
      padding: 1rem 0 1.2rem;
    }

    .footer-mini {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      align-items: center;
      color: #68728e;
      font-size: 0.86rem;
    }

    .footer-mini-note {
      color: #526084;
    }

    @media (max-width: 640px) {
      .footer-mini {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <div class="wrapper footer-mini">
    <div>© {{ "now" | date: "%Y" }} {{ site.title | escape }} · Built with Jekyll</div>
    <div class="footer-mini-note">Can you guess what the browser tab icon is?</div>
  </div>
</footer>
