<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="fantasy ring favicon">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#16181c"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e8b5"/>
      <stop offset="50%" stop-color="#cfb25a"/>
      <stop offset="100%" stop-color="#8a6a2b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <g fill="none" stroke="url(#gold)" stroke-linecap="round" filter="url(#glow)">
    <circle cx="32" cy="28" r="16" stroke-width="2.6"/>
    <ellipse cx="32" cy="36" rx="18" ry="12" stroke-width="2.2"/>
    <path d="M32 10v42" stroke-width="1.8" opacity="0.9"/>
    <path d="M20 20l24 24" stroke-width="1.4" opacity="0.65"/>
    <path d="M44 20L20 44" stroke-width="1.4" opacity="0.65"/>
  </g>
</svg>
